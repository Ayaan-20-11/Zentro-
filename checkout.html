<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Zentro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#312e81
);

min-height:100vh;

overflow:hidden;
}

/* Floating Background */

body::before{

content:"";

position:fixed;

width:400px;
height:400px;

background:#00c2ff;

border-radius:50%;

filter:blur(120px);

top:-100px;
left:-100px;

opacity:.25;

animation:float1 8s infinite alternate;
}

body::after{

content:"";

position:fixed;

width:350px;
height:350px;

background:#7c3aed;

border-radius:50%;

filter:blur(120px);

bottom:-100px;
right:-100px;

opacity:.25;

animation:float2 10s infinite alternate;
}

@keyframes float1{

from{
transform:translateY(0);
}

to{
transform:translateY(80px);
}

}

@keyframes float2{

from{
transform:translateY(0);
}

to{
transform:translateY(-80px);
}

}

.checkout-container{

display:flex;

flex-direction:column;

justify-content:center;
align-items:center;

height:100vh;

position:relative;

z-index:10;
}

.checkout-container h1{

color:white;

font-size:48px;

margin-bottom:20px;
}

.home-btn{

color:#00c2ff;

text-decoration:none;

font-weight:600;

margin-bottom:25px;
}

.checkout-card{

width:420px;

padding:35px;

background:
rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:25px;

display:flex;

flex-direction:column;

gap:18px;

box-shadow:
0 20px 50px rgba(0,0,0,.3);
}

.checkout-card input{

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

outline:none;
}

.checkout-card button{

padding:15px;

border:none;

border-radius:12px;

background:#00c2ff;

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;
}

.checkout-card button:hover{

transform:translateY(-3px);
}


/* Keyboard accessibility (#14) */

button:focus-visible,
a:focus-visible,
input:focus-visible,
.search-box input:focus-visible,
.checkout-card input:focus-visible{
outline:2px solid #00c2ff;
outline-offset:2px;
}

</style>

</head>

<body>

<div class="checkout-container">

<h1>Checkout</h1>

<a href="home.html" class="home-btn">
🏠 Back To Home
</a>

<div class="checkout-card">

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="text"
placeholder="Address">

<input
type="text"
placeholder="Phone Number">

<button onclick="placeOrder()">
Place Order 🚀
</button>

</div>

</div>
<script>

function placeOrder(){

let customerName =
document.getElementById("name").value;

localStorage.setItem(
"customerName",
customerName
);

localStorage.setItem(
"lastOrder",
localStorage.getItem("cart")
);

localStorage.removeItem("cart");

window.location.href =
"success.html";

}

</script>
</body>

</html>
