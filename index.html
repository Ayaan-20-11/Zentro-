<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;

background:
linear-gradient(rgba(0,0,0,.55),
rgba(0,0,0,.55)),
url("background.jpg");

background-size:cover;
background-position:center;

display:flex;
justify-content:flex-start;

align-items:center;

padding-left:100px;

overflow:hidden;
}
.login-box{

width:420px;

padding:40px;

background:rgba(255,255,255,0.08);

border:1px solid rgba(255,255,255,0.15);

backdrop-filter:blur(18px);

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.4);

color:white;
position: relative;
z-index: 2;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo h1{
font-size:3.5rem;
font-weight:700;
letter-spacing:1px;
}

.logo p{
opacity:.8;
font-size:.95rem;
}

h2{
margin-bottom:10px;
}

.subtitle{
opacity:.8;
margin-bottom:25px;
}

.input-group{

display:flex;
align-items:center;

background:rgba(255,255,255,.08);

padding:15px;

border-radius:12px;

margin-bottom:20px;
}

.input-group span{
font-weight:600;
margin-right:10px;
}

input{

width:100%;

border:none;
outline:none;

background:none;

color:white;

font-size:16px;
}

input::placeholder{
color:#d9d9d9;
}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#00c2ff;

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;
}

button:hover{

transform:translateY(-2px);

box-shadow:0 0 25px rgba(0,194,255,.5);
}

#otpSection{
display:none;
margin-top:20px;
}

.footer{

margin-top:20px;

text-align:center;

font-size:.8rem;

opacity:.7;
}
/* ===========================
   ZENTRO BOT
=========================== */

.zentro-bot{

position:absolute;

left:270px;

top:70px;

z-index:3;

animation:botFloat 4s ease-in-out infinite;

}

.bot-head{

width:120px;

height:120px;

border-radius:30px;

background:linear-gradient(
145deg,
#1d2b4d,
#0b132b
);

border:2px solid rgba(0,194,255,.45);

box-shadow:

0 0 25px rgba(0,194,255,.4),

0 0 60px rgba(0,194,255,.15);

position:relative;

}
.bot-message{

position:absolute;

top:135px;

left:-25px;

background:rgba(20,25,40,.95);

color:white;

padding:12px 18px;

border-radius:16px;

font-size:.9rem;

font-weight:500;

white-space:nowrap;

box-shadow:0 10px 30px rgba(0,194,255,.25);

opacity:0;

transform:translateY(10px);

transition:.35s ease;

pointer-events:none;

}

.bot-message.show{

opacity:1;

transform:translateY(0);

}
.bot-head:hover{

transform: scale(1.08) rotate(5deg);

transition: .35s ease;

cursor: pointer;

}
.eye{

width:18px;
height:18px;

background:#00c2ff;

border-radius:50%;

position:absolute;

top:38px;

box-shadow:
0 0 15px #00c2ff,
0 0 35px #00c2ff;

transition:.25s;
animation: blink 5s infinite;

}

.left-eye{

left:28px;

}

.right-eye{

right:28px;

}
.bot-smile{

width:42px;

height:18px;

border-bottom:4px solid #00c2ff;

border-radius:0 0 50px 50px;

position:absolute;

left:50%;

bottom:25px;

transform:translateX(-50%);

box-shadow:
0 0 10px rgba(0,194,255,.6);

}
@keyframes blink{

0%,45%,50%,100%{

transform:scaleY(1);

}

47%{

transform:scaleY(0.08);

}

}
@keyframes botFloat{

0%{

transform:translateY(0px);

}

50%{

transform:translateY(-12px);

}

100%{

transform:translateY(0px);

}

}
@media(max-width:500px){

.login-box{
width:90%;
}

.logo h1{
font-size:2.7rem;
}

}
/* Floating Particles */

.particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.particles span{
    position:absolute;
    display:block;
    width:8px;
    height:8px;
    background:#00c2ff;
    border-radius:50%;
    box-shadow:0 0 20px #00c2ff;
    animation:floatUp linear infinite;
    opacity:.35;
}

/* Different Positions */

.particles span:nth-child(1){left:10%;animation-duration:18s;animation-delay:0s;}
.particles span:nth-child(2){left:20%;animation-duration:22s;animation-delay:2s;}
.particles span:nth-child(3){left:35%;animation-duration:16s;animation-delay:4s;}
.particles span:nth-child(4){left:48%;animation-duration:20s;animation-delay:1s;}
.particles span:nth-child(5){left:60%;animation-duration:24s;animation-delay:5s;}
.particles span:nth-child(6){left:72%;animation-duration:17s;animation-delay:3s;}
.particles span:nth-child(7){left:80%;animation-duration:21s;animation-delay:6s;}
.particles span:nth-child(8){left:88%;animation-duration:19s;animation-delay:2s;}
.particles span:nth-child(9){left:95%;animation-duration:23s;animation-delay:4s;}
.particles span:nth-child(10){left:50%;animation-duration:15s;animation-delay:1s;}

@keyframes floatUp{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-120px);
    }

}
/* Mouse Glow */

.mouse-glow{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(0,194,255,0.18),
        transparent 70%
    );
    pointer-events:none;
    transform:translate(-50%,-50%);
    left:50%;
    top:50%;
    z-index:1;
    transition:
        left .08s linear,
        top .08s linear;
}

/* Keyboard accessibility (#14) */

#close-popup{
width:auto;
padding:0;
border:none;
border-radius:0;
background:none;
color:inherit;
font:inherit;
cursor:pointer;
}

#close-popup:hover{
transform:none;
box-shadow:none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
.search-box input:focus-visible,
.checkout-card input:focus-visible{
outline:2px solid #00c2ff;
outline-offset:2px;
}

</style>
</head>
<body>
<div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>
<div class="mouse-glow"></div>
<div class="zentro-bot">

    <div class="bot-head" id="botHead">

        <div class="eye left-eye"></div>

        <div class="eye right-eye"></div>

        <div class="bot-smile"></div>

    </div>
    <div class="bot-message" id="botMessage">
    👋 Welcome to Zentro!
    </div>

</div>
<div class="login-box">

<div class="logo">

<h1>Zentro</h1>

<p>India's Next Shopping Experience</p>

</div>

<h2>Welcome Back 👋</h2>

<p class="subtitle">
Login using your details
</p>

<div class="input-group">

<input
id="nameInput"
type="text"
placeholder="Enter Full Name">

</div>

<div class="input-group">

<span>+91</span>

<input
id="phoneInput"
type="tel"
placeholder="Enter Mobile Number"
maxlength="10"
inputmode="numeric"
pattern="[0-9]{10}"
oninput="this.value=this.value.replace(/[^0-9]/g,'')">

</div>

<button onclick="enterWorld()">
Enter The Shopping World 🚀
</button>



<div class="footer">
Secure Login Powered by Zentro
</div>


</div>

<script>

function enterWorld(){

    let fullName = document.getElementById("nameInput").value.trim();

    let phone = document.getElementById("phoneInput").value.trim();

    if(fullName === ""){
        alert("Please enter your full name");
        return;
    }

    if(phone === ""){
        alert("Please enter your mobile number 📱");
        return;
    }

    if(phone.length !== 10){
        alert("Please enter a valid 10-digit mobile number");
        return;
    }

    localStorage.setItem("userPhone", phone);
    localStorage.setItem("userName", fullName);

    window.location.href = "home.html";
}
const glow = document.querySelector(".mouse-glow");

document.addEventListener("mousemove", function(e){

    glow.style.left = e.clientX + "px";
    glow.style.top = e.clientY + "px";

});
const bot = document.getElementById("botHead");
const nameInput = document.getElementById("nameInput");
const phoneInput = document.getElementById("phoneInput");
const botMessage = document.getElementById("botMessage");

nameInput.addEventListener("focus", () => {
    bot.style.transform = "rotate(-10deg) scale(1.08)";
});
nameInput.addEventListener("input", () => {

    bot.animate(
        [
            { transform: "rotate(-10deg) translateY(0px)" },
            { transform: "rotate(-10deg) translateY(-6px)" },
            { transform: "rotate(-10deg) translateY(0px)" }
        ],
        {
            duration: 250
        }

    );

});

nameInput.addEventListener("blur", () => {
    bot.style.transform = "";
});
phoneInput.addEventListener("focus", () => {
    bot.style.transform = "rotate(10deg) scale(1.08)";
});
phoneInput.addEventListener("input", () => {

    bot.animate(
        [
            { transform: "rotate(10deg) translateY(0px)" },
            { transform: "rotate(10deg) translateY(-6px)" },
            { transform: "rotate(10deg) translateY(0px)" }
        ],
        {
            duration: 250
        }

    );

});
phoneInput.addEventListener("blur", () => {
    bot.style.transform = "";
});

setTimeout(() => {

    botMessage.textContent = "👋 Welcome to Zentro!";

    botMessage.classList.add("show");

    setTimeout(() => {

        botMessage.classList.remove("show");

    }, 3000);

}, 800);
</script>
<div id="product-popup">

    <div id="popup-content">

        <button type="button" onclick="closePopup()"
        id="close-popup" aria-label="Close">✖</button>

        <h2 id="popup-title"></h2>

        <h3 id="popup-price"></h3>

        <p id="popup-description"></p>

    </div>

</div>
</body>
</html>
